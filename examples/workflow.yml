# Copy to .github/workflows/code-review.yml in the repository you want reviewed.
name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  push:
    branches: [main] # keeps the code-graph cache warm so PR runs only re-index changed files

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Reviews of the same PR share one group so two runs never post the same finding twice:
  # pushes replace each other, "@amchi review" waits for a running review. Questions get their own run.
  group: amchi-${{ (github.event.comment.id && !contains(github.event.comment.body, '@amchi review') && format('comment-{0}', github.event.comment.id)) || github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    # Comment events only run when the bot is mentioned (and never for bot comments).
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (contains(github.event.comment.body, '@amchi') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for merge-base and incremental reviews
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || github.sha }}

      # Persist the code graph + embeddings between runs. Keyed by commit so re-runs
      # of the same commit reuse one entry instead of writing a new one each time.
      - uses: actions/cache@v5
        with:
          path: .amchi
          key: amchi-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: amchi-${{ runner.os }}-

      - uses: TenzDelek/Amchi@v2
        timeout-minutes: 18 # leave the step a margin under the job timeout; max_run_seconds (15 min) posts partial results first
        with:
          # Provide at least one key. With several, `provider` picks (default: anthropic > openai > gemini).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}   # also used for embeddings if present
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # provider: openai
          # model: gpt-5.4-mini
