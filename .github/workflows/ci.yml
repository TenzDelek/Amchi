name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check dist/ is up to date
        run: |
          npm run build
          git diff --exit-code --stat dist/ || (echo "::error::dist/ is out of date — run npm run build and commit" && exit 1)
